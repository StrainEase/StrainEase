# Deploys the StrainWise backend (Firebase Cloud Functions + Firestore rules)
# to Firebase whenever code lands on `main`, or on demand via the Actions tab.
#
# Required GitHub secrets:
#   FIREBASE_SERVICE_ACCOUNT — JSON key for a Firebase deploy service account
#     (Project owner, or: Cloud Functions Admin + Service Account User +
#     Secret Manager Secret Accessor). Generate it in Firebase console →
#     Project settings → Service accounts → Generate new private key.
#   FIREBASE_PROJECT_ID — your Firebase project id (also editable in
#     .firebaserc; only needed here if you prefer to keep it in secrets).
#
# Before the first deploy, run once locally so the secret exists:
#   firebase login
#   firebase use YOUR-PROJECT-ID
#   firebase functions:secrets:set MINIMAX_API_KEY

name: Deploy to Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Install functions dependencies
        working-directory: functions
        run: npm ci

      - name: Build functions
        working-directory: functions
        run: npm run build

      - name: Deploy functions + Firestore rules
        run: >-
          npx --yes firebase-tools deploy
          --only functions,firestore:rules
          --project "${{ secrets.FIREBASE_PROJECT_ID }}"
          --non-interactive
