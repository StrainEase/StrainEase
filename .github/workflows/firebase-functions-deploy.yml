      - name: Deploy to Firebase
        # Pin a release tag - never @master (supply-chain + reproducibility).
        uses: w9jds/firebase-action@v15.23.0
        with:
          # Deploy all Firebase targets represented in this workflow's path
          # filter: Functions, Firestore rules/indexes, and Storage rules.
          args: deploy --only functions,firestore,storage --project "${{ secrets.FIREBASE_PROJECT_ID }}" --force
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}

      - name: Authenticate Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # firebase deploy --only functions defaults to --allow-unauthenticated
      # for callables, but a stray `gcloud run services update --no-allow-
      # unauthenticated` call (or a Console IAM change) can drop the
      # `allUsers` invoker binding without redeploying. When that happens,
      # OPTIONS preflight fails with 403 at the Cloud Run layer before
      # Firebase can attach CORS headers, and the SDK's POST never lands.
      # This step re-applies the binding idempotently to every callable
      # in the project. Scheduled functions are filtered out (they use
      # the compute SA, not allUsers).
      - name: Ensure allUsers invoker on every callable
        working-directory: functions
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: node scripts/ensure-invoker.mjs