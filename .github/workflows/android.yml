# StrainEase Android - build, test, and (on demand) build an unsigned debug APK.
# Mirrors the iOS workflow conventions: a test job that always runs on PR
# and main, plus an APK-build job that runs on workflow_dispatch, push to
# main, and release published.
#
# Triggers:
#   - PR / push to main that touches anything under android/
#   - workflow_dispatch (manual run from the Actions tab) - runs both jobs
#   - release published - runs both jobs and attaches the APK to the release
#
# The release APK is unsigned (no `signingConfigs.release` block is set up
# in `android/app/build.gradle.kts` today; see the "Signing" section
# below). A debug APK is always built and signed with AGP's auto-generated
# debug keystore, so the smoke-test build is installable from CI artifacts.
#
# Signing:
#   A signed release APK is not produced by this workflow. To enable
#   signed release builds, add these secrets:
#     ANDROID_KEYSTORE_BASE64 - base64 of the keystore file
#     ANDROID_KEYSTORE_PASSWORD - keystore password
#     ANDROID_KEY_ALIAS - key alias
#     ANDROID_KEY_PASSWORD - key password
#   ...and wire them into a `signingConfigs.release` block in
#   `android/app/build.gradle.kts`. Until then, the release APK is
#   unsigned but enough to catch compile / AGP / Compose / Firebase
#   regressions.

name: StrainEase Android

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build & Test (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '11076708'
          android-version: '34'
          build-tools-version: '34.0.0'
          cache: gradle

      - name: Make gradlew executable
        working-directory: android
        run: |
          # gradlew is checked in with CRLF line endings, which makes
          # the kernel unable to parse the #!/bin/sh shebang (it sees
          # "/bin/sh" — a path that doesn't exist). Strip the CRs
          # before chmod'ing; without this the runner dies with
          # "cannot execute: required file not found" (exit 127).
          sed -i 's/\r$//' ./gradlew
          chmod +x ./gradlew
          file ./gradlew

      - name: Show toolchain
        working-directory: android
        run: |
          java -version
          ./gradlew --version

      - name: Cache Gradle build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: >-
            ${{ runner.os }}-gradle-
            ${{ hashFiles('android/gradle/libs.versions.toml',
                          'android/gradle/wrapper/gradle-wrapper.properties',
                          'android/build.gradle.kts',
                          'android/app/build.gradle.kts',
                          'android/settings.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Run lint
        working-directory: android
        run: ./gradlew lintDebug --stacktrace

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Inspect debug APK
        working-directory: android
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::debug APK not found at $APK"
            ls -la app/build/outputs/apk/debug/ || true
            exit 1
          fi
          echo "APK: $APK"
          file "$APK"
          ls -la app/build/outputs/apk/debug/
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt 2>/dev/null | head -1 || true)
          if [ -n "$AAPT" ]; then
            "$AAPT" dump badging "$APK" 2>/dev/null | head -20 || true
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: StrainEase-android-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: StrainEase-android-test-results-${{ github.sha }}
          path: |
            android/app/build/reports/tests/
            android/app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: StrainEase-android-lint-${{ github.sha }}
          path: android/app/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 14

  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'release' || github.ref == 'refs/heads/main'
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '11076708'
          android-version: '34'
          build-tools-version: '34.0.0'
          cache: gradle

      - name: Make gradlew executable
        working-directory: android
        run: |
          # gradlew is checked in with CRLF line endings, which makes
          # the kernel unable to parse the #!/bin/sh shebang (it sees
          # "/bin/sh" — a path that doesn't exist). Strip the CRs
          # before chmod'ing; without this the runner dies with
          # "cannot execute: required file not found" (exit 127).
          sed -i 's/\r$//' ./gradlew
          chmod +x ./gradlew
          file ./gradlew

      - name: Cache Gradle build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: >-
            ${{ runner.os }}-gradle-
            ${{ hashFiles('android/gradle/libs.versions.toml',
                          'android/gradle/wrapper/gradle-wrapper.properties',
                          'android/build.gradle.kts',
                          'android/app/build.gradle.kts',
                          'android/settings.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace

      - name: Inspect release APK
        working-directory: android
        run: |
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::release APK not found at $APK"
            ls -la app/build/outputs/apk/release/ || true
            exit 1
          fi
          echo "APK: $APK"
          file "$APK"
          ls -la app/build/outputs/apk/release/
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt 2>/dev/null | head -1 || true)
          if [ -n "$AAPT" ]; then
            "$AAPT" dump badging "$APK" 2>/dev/null | head -20 || true
          fi

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: StrainEase-android-release-unsigned-${{ github.sha }}
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/app-release-unsigned.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
