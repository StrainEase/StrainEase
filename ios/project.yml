name: StrainEase
options:
  bundleIdPrefix: ai.strainease
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  firebase-ios-sdk:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.12.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0
targets:
  StrainEase:
    type: application
    platform: iOS
    sources:
      - path: StrainEase
        excludes:
          - "**/.DS_Store"
          - "GoogleService-Info.plist"
          - "Resources/**"
      - path: StrainEase/Resources
        buildPhase: resources
      - path: StrainEase/GoogleService-Info.plist
        buildPhase: resources
        type: file
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.strainease.ios
        PRODUCT_NAME: StrainEase
        INFOPLIST_FILE: StrainEase/Info.plist
        GENERATE_INFOPLIST_FILE: false
        DEVELOPMENT_TEAM: 4JBMBNGPK7
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: StrainEase/StrainEase.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
        SWIFT_EMIT_LOC_STRINGS: "YES"
    dependencies:
      - package: firebase-ios-sdk
        product: FirebaseAuth
      - package: firebase-ios-sdk
        product: FirebaseFirestore
      - package: firebase-ios-sdk
        product: FirebaseFunctions
      - package: GoogleSignIn
        product: GoogleSignIn
  StrainEaseTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: StrainEaseTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.strainease.ios.tests
        GENERATE_INFOPLIST_FILE: true
        DEVELOPMENT_TEAM: 4JBMBNGPK7
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/StrainEase.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/StrainEase"
        BUNDLE_LOADER: "$(TEST_HOST)"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    dependencies:
      - target: StrainEase
schemes:
  StrainEase:
    build:
      targets:
        StrainEase: all
        StrainEaseTests: [test]
    test:
      targets:
        - StrainEaseTests
      gatherCoverageData: false
