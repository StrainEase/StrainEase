# Gradle / JVM
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# Auto-provisioning: tell Gradle where the system JDK 17 lives so the
# toolchain resolver doesn't have to guess. Multiple paths are allowed
# (comma-separated); the first that exists wins.
#
# Common install locations:
#   - Windows:  `winget install Microsoft.OpenJDK.17` lands here
#   - macOS:    brew's openjdk@17 or the system /Library/.../openjdk-17.jdk path
#   - Linux:    distro package's /usr/lib/jvm/java-17-* path
org.gradle.java.installations.paths=C:/Program Files/Microsoft/jdk-17.0.20.8-hotspot,/Library/Java/JavaVirtualMachines/openjdk-17.jdk/Contents/Home,/usr/lib/jvm/java-17-openjdk-amd64

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2g

# Disable build features we don't use to speed up clean builds.
android.defaults.buildfeatures.buildconfig=true
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false

# Enabled parallel sync
org.gradle.tooling.parallel=true
